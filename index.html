</style></head><body><main><header><h1>⏱ Finger-Timer</h1><span class="badge">Training · v4</span></header><div class="modes" role="group" aria-label="Modus"><button id="stopwatchMode" class="mode-btn active" aria-pressed="true">Stoppuhr</button><button id="timerMode" class="mode-btn" aria-pressed="false">Timer</button></div><section id="stage" class="stage" role="button" tabindex="0" aria-label="Zeit durch Tippen stoppen"><div class="eyebrow" id="status">Bereit</div><div class="time" id="display">00:00.00</div><div class="helper" id="hint">Start drücken, dann läuft der Vorlauf</div></section><section class="controls"><div class="row"><div><div class="label">Vorlauf</div><div class="sub">Signaltöne vor dem Start</div></div><div class="stepper"><button id="preMinus" aria-label="Vorlauf verringern">−</button><input id="pre" type="number" min="0" max="60" value="5" inputmode="numeric" aria-label="Vorlauf Sekunden"><button id="prePlus" aria-label="Vorlauf erhöhen">+</button></div></div><div id="durationSection" hidden><div class="divider"></div><div class="row"><div><div class="label">Timer-Dauer</div><div class="sub">Minuten : Sekunden</div></div><div class="duration"><div><div class="stepper"><button id="minMinus" aria-label="Minuten verringern">−</button><input id="minutes" type="number" min="0" max="99" value="0" inputmode="numeric" aria-label="Minuten"><button id="minPlus" aria-label="Minuten erhöhen">+</button></div><div class="unit">Min</div></div><span>:</span><div><div class="stepper"><button id="secMinus" aria-label="Sekunden verringern">−</button><input id="seconds" type="number" min="0" max="59" value="10" inputmode="numeric" aria-label="Sekunden"><button id="secPlus" aria-label="Sekunden erhöhen">+</button></div><div class="unit">Sek</div></div></div></div></div><div class="divider"></div><div class="row"><div><div class="label">Signaltöne</div><div class="sub">Vorlauf, Start & Timer-Ende</div></div><button id="sound" class="toggle" aria-label="Signaltöne" (()=>{'use strict';const $=id=>document.getElementById(id);const get=k=>{try{return localStorage.getItem('ft4-'+k)}catch{return null}},set=(k,v)=>{try{localStorage.setItem('ft4-'+k,String(v))}catch{}};const restore=(id,key,fallback)=>{$(id).value=get(key)??fallback};restore('pre','pre',5);restore('minutes','minutes',0);restore('seconds','seconds',10);$('sound').setAttribute('aria-pressed',get('sound')==='false'?'false':'true');let kind=get('mode')==='timer'?'timer':'stopwatch',state='idle',raf=0,deadline=0,started=0,duration=0,signalTimers=[],wake=null;const tick=new Audio('./beep.wav'),go=new Audio('./start.wav'),end=new Audio('./start.wav');for(const a of [tick,go,end])a.preload='auto';const enabled=()=>$('sound').getAttribute('aria-pressed')==='true';const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,Number.isFinite(Number(n))?Math.floor(Number(n)):lo));const fmt=ms=>{const cs=Math.floor(Math.max(0,ms)/10),secs=Math.floor(cs/100);return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0')};const cfg=()=>{for(const [id,k,max] of [['pre','pre',60],['minutes','minutes',99],['seconds','seconds',59]]){const n=clamp($(id).value,0,max);$(id).value=n;set(k,n)}};function cue(a){if(!enabled())return;try{a.pause();a.currentTime=0;let pr=a.play();if(pr)pr.catch(()=>{})}catch{}}function clearCues(){signalTimers.forEach(clearTimeout);signalTimers=[];for(const a of [tick,go,end]){a.pause();a.currentTime=0}}function cueAt(fn,ms){signalTimers.push(setTimeout(fn,ms))}async function lock(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}function unlock(){if(wake){wake.release().catch(()=>{});wake=null}}function stage(next,title,help){state=next;$('stage').className='stage '+next;$('status').textContent=title;$('hint').textContent=help;$('start').textContent=next==='running'?'Stoppen':next==='countdown'?'Abbrechen':'Starten';for(const id of ['pre','preMinus','prePlus','minutes','seconds',
