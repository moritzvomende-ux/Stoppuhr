<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1119"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finger-Timer"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Finger-Timer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#f4f7fc;min-height:100svh}main{max-width:550px;min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));gap:20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;letter-spacing:.03em;margin:0;font-weight:750}.badge{font-size:12px;color:#a1abc0;background:#202838;border-radius:50px;padding:7px 10px}.stage{flex:1;min-height:265px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #2b3648;border-radius:28px;background:linear-gradient(145deg,#1d2635,#141b27);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}.stage.countdown{border-color:#ffcd72}.stage.running{border-color:#62dfa5;background:linear-gradient(145deg,#16382e,#141e22)}.stage.stopped{border-color:#85adff}.eyebrow{color:#a7b5ca;text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700}.time{font-variant-numeric:tabular-nums;font-size:clamp(52px,13vw,83px);font-weight:760;letter-spacing:-.055em;line-height:1.3;margin:14px 0}.countdown .time{color:#ffd489}.running .time{color:#75e6b2}.helper{font-size:14px;color:#9caac0;text-align:center;padding:0 15px}.controls{background:#171e2a;padding:18px;border-radius:22px;border:1px solid #273244}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:15px;font-weight:650}.sub{font-size:12px;color:#91a0b5;margin-top:4px}.stepper{display:flex;align-items:center;gap:8px}.stepper button{background:#2b3648;color:#fff;border:0;font-size:24px;border-radius:12px;width:43px;height:43px}.stepper input{width:58px;text-align:center;background:transparent;border:0;color:white;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;appearance:textfield}.stepper input::-webkit-inner-spin-button{display:none}.toggle{width:52px;height:32px;border:0;background:#3d4658;border-radius:30px;padding:4px;display:flex;align-items:center;transition:.15s}.toggle span{width:24px;height:24px;background:white;border-radius:100%;display:block;transition:.15s}.toggle[aria-pressed=true]{background:#3bbb84}.toggle[aria-pressed=true] span{transform:translateX(20px)}.separator{height:1px;background:#2b3445;margin:17px 0}.buttons{display:flex;gap:10px}.primary,.secondary{border:0;padding:17px 14px;border-radius:16px;font-weight:750;font-size:17px;cursor:pointer}.primary{flex:2;background:#71e4ae;color:#11281d}.secondary{flex:1;background:#303b4e;color:white}.primary:disabled{opacity:.6}footer{font-size:12px;color:#8492a7;text-align:center;line-height:1.5}.history{font-size:13px;color:#b4c0d1;min-height:20px;text-align:center}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:3px}
</style>
</head>
<body><main>
<header><h1>⏱ Finger-Timer</h1><span class="badge">Stoppuhr mit Vorlauf</span></header>
<section id="stage" class="stage" aria-live="off" role="button" tabindex="0" aria-label="Stoppuhr durch Antippen stoppen"><div class="eyebrow" id="status">Bereit</div><div class="time" id="time">00:00.00</div><div class="helper" id="hint">Countdown einstellen und Start drücken</div></section>
<section class="controls"><div class="row"><div><div class="label">Vorlauf</div><div class="sub">0 bis 60 Sekunden</div></div><div class="stepper"><button id="minus" aria-label="Eine Sekunde weniger">−</button><input id="seconds" type="number" min="0" max="60" step="1" inputmode="numeric" aria-label="Vorlauf in Sekunden" value="5"><button id="plus" aria-label="Eine Sekunde mehr">+</button></div></div><div class="separator"></div><div class="row"><div><div class="label">Signaltöne</div><div class="sub">Countdown und Startsignal</div></div><button id="sound" class="toggle" aria-label="Signaltöne" aria-pressed="true"><span></span></button></div></section>
<div class="buttons"><button class="primary" id="start">Starten</button><button class="secondary" id="reset">Zurücksetzen</button></div>
<div class="history" id="history">Noch keine Zeit gestoppt</div><footer>Während des Trainings geöffnet lassen. Tippe auf die große Anzeige, um zu stoppen.</footer>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const stage=$('stage'),status=$('status'),display=$('time'),hint=$('hint'),seconds=$('seconds'),sound=$('sound'),start=$('start'),reset=$('reset'),history=$('history');let mode='idle',raf=0,begin=0,countEnd=0,remaining=0,lastTick=null,audio=null,wake=null,elapsed=0;const saved=k=>{try{return localStorage.getItem(k)}catch{return null}},save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};seconds.value=saved('delay')??'5';sound.setAttribute('aria-pressed',saved('sound')!=='false'?'true':'false');const clamp=n=>Math.max(0,Math.min(60,Number.isFinite(n)?Math.round(n):5));const fmt=ms=>{let cs=Math.floor(Math.max(0,ms)/10),ss=Math.floor(cs/100),mm=Math.floor(ss/60);return String(mm).padStart(2,'0')+':'+String(ss%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0')};const changeDelay=n=>{seconds.value=clamp(n);save('delay',seconds.value)};$('minus').onclick=()=>changeDelay(Number(seconds.value)-1);$('plus').onclick=()=>changeDelay(Number(seconds.value)+1);seconds.onchange=()=>changeDelay(Number(seconds.value));sound.onclick=()=>{let on=sound.getAttribute('aria-pressed')!=='true';sound.setAttribute('aria-pressed',String(on));save('sound',String(on));if(on)tone(700,.06)};
function tone(freq=700,len=.12){if(sound.getAttribute('aria-pressed')!=='true')return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;oscillator.type='sine';oscillator.frequency.value=freq;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.20,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+len);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(now);oscillator.stop(now+len+.02)}catch{}}
async function requestWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}function releaseWake(){if(wake){wake.release().catch(()=>{});wake=null}}function updateState(next,label,description){mode=next;stage.className='stage '+(next==='idle'?'':next);status.textContent=label;hint.textContent=description;start.textContent=next==='running'?'Stoppen':next==='countdown'?'Abbrechen':next==='stopped'?'Erneut starten':'Starten';seconds.disabled=next==='countdown'||next==='running';$('minus').disabled=seconds.disabled;$('plus').disabled=seconds.disabled}
function run(){cancelAnimationFrame(raf);begin=performance.now();lastTick=null;updateState('running','Läuft','Zum Stoppen irgendwo auf die Anzeige tippen');tone(1060,.23);raf=requestAnimationFrame(frame)}function frame(now){if(mode==='countdown'){const left=countEnd-now;if(left<=0){run();return}const current=Math.ceil(left/1000);display.textContent=String(current);if(current!==lastTick){lastTick=current;tone(630,.085)}raf=requestAnimationFrame(frame)}else if(mode==='running'){elapsed=now-begin;display.textContent=fmt(elapsed);raf=requestAnimationFrame(frame)}}
function beginCycle(){cancelAnimationFrame(raf);changeDelay(Number(seconds.value));try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}requestWake();const n=Number(seconds.value);display.textContent=n?String(n):'00:00.00';if(n===0){run();return}countEnd=performance.now()+n*1000;lastTick=null;updateState('countdown','Bereit machen','Startet automatisch nach dem Signal');raf=requestAnimationFrame(frame)}function stop(){if(mode!=='running')return;elapsed=performance.now()-begin;cancelAnimationFrame(raf);display.textContent=fmt(elapsed);updateState('stopped','Gestoppt','Deine gemessene Zeit');history.textContent='Letzte Zeit: '+fmt(elapsed);save('last',fmt(elapsed));releaseWake();tone(450,.11)}function clear(){cancelAnimationFrame(raf);releaseWake();elapsed=0;display.textContent='00:00.00';updateState('idle','Bereit','Countdown einstellen und Start drücken')};start.onclick=()=>{if(mode==='running')stop();else if(mode==='countdown')clear();else beginCycle()};reset.onclick=clear;stage.onclick=()=>{if(mode==='running')stop()};stage.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&mode==='running'){e.preventDefault();stop()}};if(saved('last'))history.textContent='Letzte Zeit: '+saved('last');document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='running'&&!wake)requestWake()});if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
